name: Deploy Dev
on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: tikto-calender/reusable-workflow/.github/workflows/cd-dev.yml@fb91f225096ec3df8fc0beff53662e6b87414ccc
    with:
      component: notification
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
