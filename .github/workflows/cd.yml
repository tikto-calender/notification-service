name: Deploy Dev
on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: tikto-calender/reusable-workflow/.github/workflows/cd-dev.yml@a86d87a127e64901a8a2800f4362a95d9d76654b
    with:
      component: notification
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
