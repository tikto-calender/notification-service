name: Deploy development
on:
  push:
    branches: [dev, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gitops-dev
  cancel-in-progress: false

jobs:
  quality:
    uses: tikto-calender/reusable-workflow/.github/workflows/python-ci.yml@main

  publish:
    needs: quality
    uses: tikto-calender/reusable-workflow/.github/workflows/ghcr-dev.yml@main
    with:
      component: notification
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
