name: Promote to production
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest confirmed running and Healthy in Dev (sha256:...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitops-prod
  cancel-in-progress: false

jobs:
  promote:
    uses: tikto-calender/reusable-workflow/.github/workflows/gitops-promote.yml@bdf76770e0346eee74be21ef82919ed7aeefdb1a
    with:
      component: notification
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
      digest: ${{ inputs.digest }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
