name: Finalize release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already verified on Production, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    uses: tikto-calender/reusable-workflow/.github/workflows/finalize-release.yml@dbdf77356c14e76c1320f334cd0c18fcff47b659
    with:
      component: notification
      version: ${{ inputs.version }}
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      MANIFEST_READ_TOKEN: ${{ secrets.MANIFEST_READ_TOKEN || secrets.GITOPS_TOKEN }}
