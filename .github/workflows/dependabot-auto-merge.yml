name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tikto-calender/reusable-workflow/.github/workflows/dependabot-auto-merge.yml@main
    with:
      target-branch: dev
      allow-patch: true
      allow-minor: true
      allow-major: false
      auto-approve: false
      merge-method: squash
