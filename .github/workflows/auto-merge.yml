name: Auto-merge feature pull request

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge after CI
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Validate PR and enable squash auto-merge
        shell: bash
        run: |
          set -euo pipefail

          pr_number=$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.pull_requests[0].number // empty'
          )
          tested_head=$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.pull_requests[0].head.sha // empty'
          )

          if [[ -z "${pr_number}" || -z "${tested_head}" ]]; then
            echo "No pull request is associated with this CI run."
            exit 0
          fi

          mapfile -t pr < <(
            gh pr view "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json author,baseRefName,headRefOid,isCrossRepository,isDraft,state \
              --jq '.author.login, .baseRefName, .headRefOid, .isCrossRepository, .isDraft, .state'
          )

          author="${pr[0]:-}"
          base_ref="${pr[1]:-}"
          current_head="${pr[2]:-}"
          cross_repository="${pr[3]:-true}"
          draft="${pr[4]:-true}"
          state="${pr[5]:-UNKNOWN}"

          if [[ "${base_ref}" != "dev" ]]; then
            echo "PR does not target dev."
            exit 0
          fi
          if [[ "${author}" == "dependabot[bot]" ]]; then
            echo "Dependabot PR is handled by the dedicated update policy workflow."
            exit 0
          fi
          if [[ "${cross_repository}" == "true" || "${draft}" == "true" || "${state}" != "OPEN" ]]; then
            echo "PR is not eligible for automatic merge."
            exit 0
          fi
          if [[ "${tested_head}" != "${current_head}" ]]; then
            echo "A newer commit exists; waiting for its CI run."
            exit 0
          fi

          gh pr merge "${pr_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --auto \
            --squash \
            --delete-branch
