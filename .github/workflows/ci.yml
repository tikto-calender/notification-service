name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/**"
      - "test/**"
      - main.py
      - Dockerfile
      - pyproject.toml
      - requirements-dev.txt
      - sonar-project.properties
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test and compile
    uses: tikto-calender/reusable-workflow/.github/workflows/ci-python.yml@main
