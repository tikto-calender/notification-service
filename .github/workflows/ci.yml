name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test and compile
    uses: tikto-calender/reusable-workflow/.github/workflows/python-ci.yml@main
    with:
      coverage-artifact-name: notification-coverage

  sonar:
    name: SonarQube
    needs: quality
    uses: tikto-calender/reusable-workflow/.github/workflows/sonarqube.yml@main
    with:
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
      coverage-artifact-name: notification-coverage
      coverage-download-path: "."
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
